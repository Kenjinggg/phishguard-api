services:
  - type: web
    name: phishguard-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 4 --threads 2 --timeout 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PHISHGUARD_API_KEY
        sync: false